name: CI

on:
  # Run on push to any branch
  push:
    branches:
      - '**'

  # Run on pull requests to any branch
  pull_request:
    branches:
      - '**'

  # Run weekly on Sundays at 00:00 UTC
  schedule:
    - cron: '0 0 * * 0'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache plate model data
        uses: actions/cache@v4
        with:
          # The tarball, not the extracted tree. The Makefile's extract rule
          # depends on the tarball, so a hit skips the download and still
          # unpacks locally. Deliberately no restore-keys: if the URL in the
          # Makefile changes, a fuzzy hit would restore the old tarball, make
          # would see its target satisfied, and the run would quietly test
          # against the wrong plate model. One re-download after a Makefile
          # edit is the cheaper mistake.
          path: examples/Matthews_et_al_410_0.tar.gz
          key: ${{ runner.os }}-plate-model-${{ hashFiles('examples/Makefile') }}

      - name: Download plate model data
        working-directory: examples
        run: make data

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          pip install pytest-cov
          python -m pytest tests/ -v --cov=gtrack --cov-report=term-missing --cov-report=xml

      - name: Upload coverage reports
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true
